<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>札幌旅行待辦</title>
<meta name="description" content="2026/12/11–12/16 北海道札幌六天五夜行程">
<meta name="theme-color" content="#FFFCF6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="札幌雪旅">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFFCF6; --ink:#3E3A39; --pink:#F2A497; --yellow:#F6D27A; --blue:#A8D3E6; --green:#B9DAA5;
  --white:#FFFFFF; --soft:#F4EFE6;
  --r:22px; --b:3px solid var(--ink);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{font-family:"Huninn","PingFang TC","Noto Sans TC",sans-serif;background:var(--paper);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}

/* nav */
nav{position:sticky;top:0;z-index:50;background:var(--paper);border-bottom:var(--b)}
nav .wrap{display:flex;align-items:center;gap:6px;height:60px;overflow-x:auto;scrollbar-width:none}
nav .wrap::-webkit-scrollbar{display:none}
.logo{font-size:18px;white-space:nowrap;margin-right:auto;display:flex;align-items:center;gap:6px}
nav a.nl{text-decoration:none;font-size:14px;padding:4px 11px;border:2px solid var(--ink);border-radius:999px;white-space:nowrap;background:var(--white)}
nav a.nl:active{transform:translateY(1px)}

section{padding:28px 0}
h2{font-size:24px;font-weight:400;display:flex;align-items:center;gap:10px;margin-bottom:16px}
h2 .dot{width:18px;height:18px;border:var(--b);border-radius:50%;flex:none}
.card{background:var(--white);border:var(--b);border-radius:var(--r);padding:18px;box-shadow:4px 4px 0 var(--ink)}

/* hero */
.hero{padding-top:18px}
.hero-art{border:var(--b);border-radius:28px;overflow:hidden;background:var(--blue);box-shadow:4px 4px 0 var(--ink)}
.hero-art svg{display:block;width:100%;height:auto}
.hero h1{font-size:34px;font-weight:400;line-height:1.25;margin:20px 0 6px;text-align:center}
.hero .sub{text-align:center;font-size:16px}
.tagrow{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-top:12px}
.pill{font-size:13px;padding:2px 12px;border:2px solid var(--ink);border-radius:999px;background:var(--yellow)}
.countdown{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:20px}
.cd{background:var(--white);border:var(--b);border-radius:18px;text-align:center;padding:10px 4px}
.cd b{display:block;font-size:30px;font-weight:400;line-height:1.1;font-variant-numeric:tabular-nums}
.cd span{font-size:12px}
.cd:nth-child(1){background:var(--pink)}.cd:nth-child(2){background:var(--yellow)}.cd:nth-child(3){background:var(--green)}.cd:nth-child(4){background:var(--blue)}
.cd-msg{text-align:center;margin-top:10px;font-size:14px}

/* flights */
.flights{display:grid;gap:16px}
.flight{position:relative;overflow:hidden}
.flight .lab{display:inline-block;font-size:13px;padding:2px 12px;border:2px solid var(--ink);border-radius:999px;margin-bottom:10px}
.route{display:flex;align-items:center;justify-content:space-between;gap:8px}
.port{text-align:center;min-width:72px}
.port b{display:block;font-size:30px;font-weight:400;line-height:1}
.port small{font-size:12px}
.port .t{font-size:18px;margin-top:4px}
.path{flex:1;position:relative;height:40px}
.path:before{content:"";position:absolute;left:0;right:0;top:50%;border-top:3px dashed var(--ink)}
.path svg{position:absolute;left:50%;top:50%;width:40px;height:40px;transform:translate(-50%,-50%)}
.fmeta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;padding-top:10px;border-top:2px dashed var(--ink);font-size:14px}
.note{font-size:13px;opacity:.8;margin-top:10px}

/* days */
.daytabs{display:flex;gap:8px;overflow-x:auto;padding:4px 4px 10px;margin:0 -4px;scrollbar-width:none}
.daytabs::-webkit-scrollbar{display:none}
.daytab{flex:none;font-family:inherit;color:var(--ink);background:var(--white);border:var(--b);border-radius:18px;padding:6px 12px;cursor:pointer;text-align:center;min-width:64px;font-size:13px;line-height:1.3}
.daytab b{display:block;font-size:22px;font-weight:400}
.daytab[aria-selected="true"]{background:var(--yellow);box-shadow:3px 3px 0 var(--ink);transform:translate(-1px,-1px)}
.daytab:focus-visible,.nl:focus-visible,button:focus-visible{outline:3px dashed var(--pink);outline-offset:3px}
.dayhead{display:flex;gap:14px;align-items:center;margin-bottom:6px}
.dayhead .ic{width:84px;height:84px;flex:none;border:var(--b);border-radius:20px;background:var(--blue);overflow:hidden}
.dayhead .ic svg{width:100%;height:100%;display:block}
.dayhead h3{font-size:21px;font-weight:400;line-height:1.3}
.dayhead p{font-size:14px}
.bounce{animation:pop .55s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{0%{transform:scale(.92) translateY(10px);opacity:0}60%{transform:scale(1.02) translateY(-3px);opacity:1}100%{transform:none}}

.tl{list-style:none;margin-top:16px;position:relative}
.tl:before{content:"";position:absolute;left:52px;top:8px;bottom:8px;border-left:3px dotted var(--ink)}
.tl li{display:grid;grid-template-columns:44px 20px 1fr;gap:0 8px;padding-bottom:14px;position:relative}
.tl .tm{font-size:14px;text-align:right;padding-top:2px;font-variant-numeric:tabular-nums}
.tl .nd{width:16px;height:16px;border:3px solid var(--ink);border-radius:50%;background:var(--paper);margin:4px 0 0 2px;z-index:1}
.tl li.must .nd{background:var(--pink)}
.tl .bx{background:var(--paper);border:2px solid var(--ink);border-radius:16px;padding:10px 12px}
.tl li.must .bx{background:#FFF1EE}
.tl .ti{font-size:16px;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.tl .ds{font-size:13.5px;margin-top:3px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tg{font-size:12px;padding:1px 9px;border:2px solid var(--ink);border-radius:999px;white-space:nowrap}
.tg.jr{background:var(--blue)}.tg.metro{background:var(--green)}.tg.walk{background:var(--yellow)}.tg.bus{background:var(--pink)}.tg.tram{background:var(--white)}.tg.air{background:var(--soft)}
.must-b{font-size:12px;padding:1px 9px;border-radius:999px;background:var(--ink);color:var(--paper)}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;font-size:12px;align-items:center}
.daytip{margin-top:4px;font-size:14px;background:var(--soft);border-radius:14px;padding:10px 12px;border:2px dashed var(--ink)}

/* todo */
.todo-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.bar{flex:1;height:18px;border:var(--b);border-radius:999px;background:var(--paper);overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-right:3px solid var(--ink);width:0;transition:width .4s}
.todo-grp{font-size:15px;margin:14px 0 6px;display:flex;align-items:center;gap:6px}
.todo-grp:first-of-type{margin-top:0}
.todo label{display:flex;align-items:center;gap:10px;padding:8px 10px;border:2px solid var(--ink);border-radius:14px;margin-bottom:6px;cursor:pointer;background:var(--paper);font-size:15px}
.todo input{appearance:none;-webkit-appearance:none;width:24px;height:24px;border:3px solid var(--ink);border-radius:8px;background:var(--white);flex:none;display:grid;place-items:center;cursor:pointer}
.todo input:checked{background:var(--green)}
.todo input:checked:after{content:"";width:6px;height:11px;border:solid var(--ink);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.todo input:checked + span{text-decoration:line-through;opacity:.55}
.btn{font-family:inherit;font-size:13px;color:var(--ink);background:var(--white);border:2px solid var(--ink);border-radius:999px;padding:3px 12px;cursor:pointer}

/* hotel */
.hotel{display:grid;gap:14px}
.hotel-art{border:var(--b);border-radius:18px;background:var(--blue);overflow:hidden}
.hotel-art svg{display:block;width:100%;height:auto}
.hotel h3{font-size:20px;font-weight:400;line-height:1.35}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14.5px}
.kv dt{white-space:nowrap}
.kv dt:before{content:"";display:inline-block;width:10px;height:10px;border:2px solid var(--ink);border-radius:50%;background:var(--yellow);margin-right:6px;vertical-align:1px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.actions a{text-decoration:none;font-size:14px;padding:6px 14px;border:var(--b);border-radius:999px;background:var(--pink)}
.actions a:nth-child(2){background:var(--green)}

footer{text-align:center;padding:30px 0 50px;font-size:13px}

/* motion */
.float{animation:float 4s ease-in-out infinite}
.float2{animation:float 5s ease-in-out infinite .8s}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3.5s ease-in-out infinite}
.snow circle{animation:fall linear infinite}
.drift{animation:drift 18s linear infinite}
.plane{animation:bob 2.4s ease-in-out infinite}
.blink{animation:blink 2.2s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes bob{0%,100%{transform:translate(-50%,-50%) rotate(0)}50%{transform:translate(-50%,-62%) rotate(-4deg)}}
@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@keyframes fall{0%{transform:translateY(-30px)}100%{transform:translateY(330px)}}
@keyframes drift{0%{transform:translateX(-120px)}100%{transform:translateX(720px)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){
  *,*:before,*:after{animation:none!important;transition:none!important}
  html{scroll-behavior:auto}
  .snow{display:none}
}
@media (min-width:640px){
  .hero h1{font-size:44px}
  .flights{grid-template-columns:1fr 1fr}
  .hotel{grid-template-columns:1fr 1.2fr;align-items:start}
}
</style>
</head>
<body>

<nav aria-label="主選單">
  <div class="wrap">
    <a class="logo" href="index.html" style="text-decoration:none">
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><g stroke="#3E3A39" stroke-width="2.5" stroke-linecap="round"><path d="M13 2v22M3.5 7.5l19 11M3.5 18.5l19-11"/></g><circle cx="13" cy="13" r="3.5" fill="#A8D3E6" stroke="#3E3A39" stroke-width="2.5"/></svg>
      札幌雪旅
    </a>
    <a class="nl" href="index.html#weather">天氣</a>
    <a class="nl" href="index.html#flight">航班</a>
    <a class="nl" href="index.html#days">行程</a>
    <a class="nl" href="todo.html" aria-current="page" style="background:var(--yellow)">待辦</a>
    <a class="nl" href="gifts.html">伴手禮</a>
    <a class="nl" href="money.html">分帳</a>
    <a class="nl" href="index.html#hotel">住宿</a>
  </div>
</nav>

<main>
<section class="hero">
  <div class="wrap">
    <div class="hero-art" style="background:var(--green)">
      <svg viewBox="0 0 700 220" role="img" aria-label="打包行李的插圖">
        <rect width="700" height="220" fill="#B9DAA5"/>
        <g class="snow" fill="#FFFCF6" stroke="#3E3A39" stroke-width="1.5">
          <circle cx="60" cy="0" r="5" style="animation-duration:7s"/><circle cx="180" cy="0" r="4" style="animation-duration:9s;animation-delay:-3s"/>
          <circle cx="520" cy="0" r="5" style="animation-duration:8s;animation-delay:-5s"/><circle cx="640" cy="0" r="4" style="animation-duration:10s;animation-delay:-2s"/>
        </g>
        <path d="M0 185 Q350 170 700 185 V220 H0Z" fill="#FFFCF6" stroke="#3E3A39" stroke-width="3"/>
        <g class="float">
          <rect x="270" y="70" width="160" height="110" rx="18" fill="#F2A497" stroke="#3E3A39" stroke-width="3"/>
          <path d="M315 70V48h70v22" fill="none" stroke="#3E3A39" stroke-width="4"/>
          <path d="M270 118h160" stroke="#3E3A39" stroke-width="3"/>
          <rect x="335" y="108" width="30" height="20" rx="4" fill="#F6D27A" stroke="#3E3A39" stroke-width="3"/>
          <circle cx="300" cy="186" r="7" fill="#3E3A39"/><circle cx="400" cy="186" r="7" fill="#3E3A39"/>
          <rect x="290" y="82" width="34" height="22" rx="4" fill="#A8D3E6" stroke="#3E3A39" stroke-width="2.5" transform="rotate(-8 307 93)"/>
          <text x="307" y="98" text-anchor="middle" font-size="11" fill="#3E3A39" transform="rotate(-8 307 93)" font-family="Huninn,sans-serif">CTS</text>
        </g>
        <g class="float2">
          <rect x="150" y="110" width="56" height="44" rx="6" fill="#FFFCF6" stroke="#3E3A39" stroke-width="3"/>
          <path d="M150 124h56" stroke="#3E3A39" stroke-width="3"/><circle cx="178" cy="140" r="6" fill="#F2A497" stroke="#3E3A39" stroke-width="2.5"/>
          <text x="178" y="120" text-anchor="middle" font-size="9" fill="#3E3A39" font-family="Huninn,sans-serif">PASSPORT</text>
        </g>
        <g class="sway">
          <path d="M500 175 L520 120 L540 175Z" fill="#FFFCF6" stroke="#3E3A39" stroke-width="3" stroke-linejoin="round"/>
          <path d="M490 110 Q520 90 550 110 L545 118 Q520 104 495 118Z" fill="#A8D3E6" stroke="#3E3A39" stroke-width="3" stroke-linejoin="round"/>
          <circle cx="520" cy="92" r="8" fill="#F6D27A" stroke="#3E3A39" stroke-width="3"/>
        </g>
      </svg>
    </div>
    <h1>出發前待辦清單</h1>
    <p class="sub">打勾的項目會記在這支手機／瀏覽器裡</p>
  </div>
</section>

<section id="todo">
  <div class="wrap">
        <div class="card todo">
      <div class="todo-top">
        <div class="bar" aria-hidden="true"><i id="todoBar"></i></div>
        <span id="todoCount">0 / 0</span>
        <button class="btn" id="todoReset" type="button">重設</button>
      </div>
      <div id="todoList"></div>
    </div>
    <p style="text-align:center;margin-top:20px"><a class="nl" href="index.html" style="text-decoration:none;font-size:15px;padding:6px 16px;border:3px solid var(--ink);border-radius:999px;background:var(--pink)">← 回行程首頁</a></p>
  </div>
</section>
</main>

<footer>
  <svg width="60" height="24" viewBox="0 0 60 24" aria-hidden="true"><g fill="#FFFCF6" stroke="#3E3A39" stroke-width="2"><circle cx="10" cy="12" r="5"/><circle cx="30" cy="12" r="6" fill="#F2A497"/><circle cx="50" cy="12" r="5"/></g></svg>
  <p>札幌雪國小旅行・2026 冬<br>出門記得穿防滑鞋，路面結冰很滑喔！</p>
</footer>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
/* ====== 待辦 ====== */
const TODOS = [
 {g:"證件＆預約", c:"var(--pink)", items:["護照效期 6 個月以上","填寫 Visit Japan Web","旅遊平安險／不便險","列印或存好 MyStays 訂房確認信","預約定山溪かっぱライナー巴士","兌換日圓現金","AirAsia 加購托運行李","安排凌晨到桃園機場的交通"]},
 {g:"禦寒裝備", c:"var(--blue)", items:["防水雪靴／防滑鞋","冰爪（鞋底防滑套）","發熱衣褲 + 羽絨外套","毛帽、手套、圍巾","暖暖包","護唇膏、乳液（超乾燥）"]},
 {g:"電子＆其他", c:"var(--green)", items:["日本 eSIM／網卡","行動電源（隨身登機）","手機掛上 Suica/ICOCA","常備藥品","折疊購物袋（裝伴手禮）"]}
];

/* 待辦（存在瀏覽器） */
const KEY = "sapporo2026-todo";
let done = {};
try { done = JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(done)); } catch(e) {} }
function renderTodo(){
  let n=0, all=0;
  $("todoList").innerHTML = TODOS.map((g,gi)=>`
    <div class="todo-grp"><span class="dot" style="width:14px;height:14px;border:3px solid var(--ink);border-radius:50%;background:${g.c};display:inline-block"></span>${esc(g.g)}</div>
    ${g.items.map((t,ti)=>{ const k=gi+"-"+ti; all++; if(done[k]) n++;
      return `<label><input type="checkbox" data-k="${k}" ${done[k]?"checked":""}><span>${esc(t)}</span></label>`; }).join("")}
  `).join("");
  $("todoCount").textContent = n+" / "+all;
  $("todoBar").style.width = (all? n/all*100:0)+"%";
}
$("todoList").addEventListener("change", e=>{
  const k=e.target.dataset.k; if(!k) return;
  done[k]=e.target.checked; save();
  let n=Object.values(done).filter(Boolean).length, all=TODOS.reduce((a,g)=>a+g.items.length,0);
  $("todoCount").textContent=n+" / "+all; $("todoBar").style.width=(n/all*100)+"%";
});
$("todoReset").addEventListener("click", ()=>{ done={}; save(); renderTodo(); });
renderTodo();
</script>
<script>
if ("serviceWorker" in navigator) { window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(()=>{}); }); }
</script>
</body>
